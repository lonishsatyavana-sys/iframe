<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style> 
    * { box-sizing: border-box; font-family: 'calibri';}
    body { margin: 0px; }
    .container { width: 80%; height: 80vh; background-color: #fde;
        margin: 80px auto;}
    .box1 { width:100% ; height: 20vh; background-color: #d1e8ff;}
    .box2 { width:100% ; height: 40vh; background-color: rgb(241, 248, 244);
    display: flex;}
    .boxleft { width:30% ; height: 40vh; background-color: rgb(105, 68, 238);}
    .boxright { width:70% ; height: 40vh; background-color: rgb(251, 177, 233);}
    .box12 { width:100% ; height: 20vh; }
    .box12:nth-child(1) {background-color: #aaa;}
    .box12:nth-child(2) {background-color: #fbb; display: flex;}
    .left { width: 50%; height: 20vh; background-color: #fbc;}
    .right { width: 50%; height: 20vh; background-color: #f54;}


</style>
</head>
<body> 
    <h1 align="center">flax box</h1>
    <div class="container">
        <div class="box1"></div>
        <div class="box2">
            <div class="boxleft"></div>
            <div class="boxright">
                <div class="box12"></div>
                <div class="box12">
                    <div class="left"></div>
                    <div class="right"></div>
                </div>
            </div>
        </div>
        <div class="box1"></div>
    </div>
</body>
</html>
