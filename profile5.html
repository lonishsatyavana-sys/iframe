<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/fontawesome-free-7.3.1-web/css/all.min.css">
    <style>
        .con{
            height: 800px;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            border: 1px solid black;
            display: flex;
            align-items: center;
            
        }
        .left,center,.right{
            border: 1px solid black;
            height: 100%;
            
        }
        .left{
            width: 2%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            width: 63%;
            font-size: 130px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            color: navy;

        }

        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }
        .right{
            width: 35%;
        }
        .top{
            height: 30%;
            border: 1px solid black;
        }
        .bottom{
            height: 700;
        }

        .bottom>h1{
            text-align: center;
        }
        .topin{
            height: 90%;
            border: 1px solid navy;
            background-color: navy;
        }
        .circle{
            border-radius: 50%;
            height: 150px;
            width: 150px;
            position: absolute;
            top: 125px;
            right: 310px;
            border: 5px solid navy;
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        img{
            height: 100%;
            width: 100%;
            border: 2px solid white;
            border-radius: 50%;

        }
        .button{
            height: 20%;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .button1{
            border-radius: 20px;
            text-align: center;
            color: white;
            line-height: 40px;
            height: 50%;
            width: 40%;
            background-color: navy;

        }
        .bottom{
            height: 70%;
            border: 1px solid black;
        }
        .icon{
            height: 20%;
        }
        .fa-instagram{
            color:red
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center"><p>Profile Card UX UI Desgin</p> </div>
            <div class="right">
                <div class="top">
                    <div class="topin">
                        <div class="circle">
                            <img src="image.2.PNG" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Web site developer </h1>
                    <h1>Dezyne ecole collage </h1>
                    <h1>BCA 1st year </h1>
                    <div class="icon">
                        <i class="fa fa-brands fa-instagram "></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                    </div>
                    <div class="button">
                        <div class="button1">Subscribe</div>
                        <div class="button1">Massage</div>
                    </div>
                    <div class="icon">
                        <i class="fa fa-solid fa-like  fa-2x"></i>
                        <i class="fa fa-solid fa-comment fa-2x"></i>
                        <i class="fa fa-solid fa-share fa-2x"></i>
                        
                    </div>
                    
                </div>
            
            </div>
        </div>
    </div>
</body>
</html>
